[project]
name = "solar-dashboard"
version = "0.1.0"
description = "Solar Fleet Operations & Monitoring Dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "matplotlib>=3.11.2",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-docx>=1.2.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.workspace]

